name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip list | grep -i pytest

      - name: Run tests with coverage
        env:
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          DB_NAME: ${{ secrets.TEST_DB_NAME }}
          MOCK_DB: ${{ vars.MOCK_DB }}
          DEBUG: ${{ vars.DEBUG }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: pytest --cov=app --cov-report=term-missing tests/
